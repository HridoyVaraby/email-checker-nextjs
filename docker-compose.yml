version: '3.8'

services:
  app:
    container_name: email-checker
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3333:3000"
    environment:
      # Use the volume path for SQLite
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Persist the SQLite database
      - email_checker_data:/app/prisma

volumes:
  email_checker_data:
